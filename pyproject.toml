[project]
name = "bus-factor"
version = "0.1.0"
description = "Calculate bus factor for any GitHub repo"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "pydantic>=2.11.7",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "rich>=14.3.3",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.2",
    "ruff>=0.11.12",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
