[project]
name = "osendowment-model"
version = "0.1.0"
description = "Value and risk metrics analysis for open-source funding decisions"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Open Source Endowment Foundation" },
]
maintainers = [
    { name = "Konstantin Vinogradov", email = "konstantin@endowment.dev" },
    { name = "Vlad-Stefan Harbuz", email = "vlad@vlad.website" },
    { name = "Jonathan Starr", email = "jon@endowment.dev" },
]
dependencies = [
    "aiohttp>=3.13.3",
    "httpx[http2]>=0.28.1",
    "networkx>=3.6.1",
    "pydantic>=2.11.7",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.2",
    "ruff>=0.11.12",
    "pandas>=3.0.1",
    "tqdm>=4.67.3",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
